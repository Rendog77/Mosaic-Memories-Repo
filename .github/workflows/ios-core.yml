name: iOS core

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift-tests:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Build package including SwiftUI shell
        run: swift build
      - name: Build Apple Photos integration for iOS Simulator
        run: xcodebuild -scheme MosaicApplePhotos -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run package tests
        run: swift test
