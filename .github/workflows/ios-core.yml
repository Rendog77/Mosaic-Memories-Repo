name: iOS core

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift-tests:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Build package including SwiftUI shell
        run: swift build
      - name: Build Apple Photos integration for iOS Simulator
        run: xcodebuild -scheme MosaicApplePhotos -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run package tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode application project
        run: xcodegen generate
      - name: Build universal iOS application
        run: xcodebuild -project MosaicMemories.xcodeproj -scheme MosaicMemories -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/app-derived CODE_SIGNING_ALLOWED=NO build
      - name: Launch and relaunch application on iPhone Simulator
        run: bash ci/smoke-ios-simulator.sh iPhone
      - name: Launch and relaunch application on iPad Simulator
        run: bash ci/smoke-ios-simulator.sh iPad
      - name: Test native photo-picker presentation on iPhone Simulator
        run: bash ci/test-picker-ui.sh
      - name: Export picker test diagnostics
        if: failure()
        working-directory: ios
        run: |
          if [ -d .build/picker-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path .build/picker-ui.xcresult --output-path .build/picker-ui-attachments
          fi
      - name: Upload picker test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: picker-ui-diagnostics
          path: ios/.build/picker-ui-attachments
          if-no-files-found: ignore
