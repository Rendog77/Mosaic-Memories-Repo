name: iOS core

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift-tests:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Run package tests
        run: swift test
